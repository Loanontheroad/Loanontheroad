name: Refresh development activity

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-activity.mjs
      - scripts/update-activity.test.mjs
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check generator
        run: node --test scripts/update-activity.test.mjs
      - name: Refresh from public GitHub data
        env:
          PROFILE_USER: Loanontheroad
        run: node scripts/update-activity.mjs
      - name: Save refreshed activity
        run: |
          git add README.md assets/activity*.svg
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh development activity'
          git push
